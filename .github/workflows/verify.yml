name: verify
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: cmake -S . -B build && cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
      - run: npm test && npm run build && npm pack --json > build/pack.json && npm run check:package
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-asan -DQUICKJS_SANITIZE=ON && cmake --build build-asan -j 4
      - run: ctest --test-dir build-asan --output-on-failure
